name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend:
    name: Frontend (build, lint, typecheck, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Security audit (high/critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.invalid

  backend:
    name: Backend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SSTerraSaaS.sln

      - name: Build
        run: dotnet build SSTerraSaaS.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test BackendAPI.Tests/BackendAPI.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: BackendAPI.Tests/TestResults/

  deploy-prod:
    name: Deploy to Render (prod)
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RENDER_SERVICE_ID: srv-da0vemmgekts73fttp8g
    steps:
      - name: Trigger Render deploy
        id: trigger
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" -ge 300 ]; then
            echo "::error::Render deploy trigger failed (HTTP $code)"
            exit 1
          fi
          deploy_id=$(echo "$body" | jq -r '.id // .deploy.id // empty')
          if [ -z "$deploy_id" ]; then
            echo "::error::Could not parse deploy id from Render response"
            exit 1
          fi
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deploy to finish (up to ~8 min)
        run: |
          deploy_id="${{ steps.trigger.outputs.deploy_id }}"
          for i in $(seq 1 48); do
            status=$(curl -s -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${deploy_id}" | jq -r '.status')
            echo "Deploy status: $status"
            case "$status" in
              live)
                echo "Deploy succeeded."
                exit 0 ;;
              build_failed|update_failed|canceled|deactivated)
                echo "::error::Render deploy failed with status $status"
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::warning::Timed out waiting for Render deploy to finish after 8 min; check the Render dashboard directly."
